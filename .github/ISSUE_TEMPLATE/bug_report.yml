name: Bug report
description: Report a reproducible problem in code, documentation or the research pipeline.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, proprietary data or licensed datasets."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include command, code version and a safe minimal example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, dependency versions"
    validations:
      required: true
